name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@v8.0
        with:
          version: 30.1

      # holy-books.org is the source; fail if the committed tangled files have drifted from it.
      - name: Check the tangle is a fixpoint
        run: |
          emacs -Q --batch --eval "(progn (require 'ob-tangle) (org-babel-tangle-file \"holy-books.org\"))"
          git diff --exit-code

      # snap is not yet on MELPA; tests.el expects it, and its fancy-C-x-C-e dependency, in ~
      - name: Fetch snap
        run: |
          git clone --depth 1 https://github.com/alhassy/snap ~/snap
          git clone --depth 1 https://github.com/alhassy/fancy-C-x-C-e ~/fancy-C-x-C-e

      - name: Install MELPA dependencies
        run: |
          emacs --batch --eval "(progn
            (require 'package)
            (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)
            (package-initialize) (package-refresh-contents)
            (dolist (p '(s dash)) (package-install p)))"

      - name: Run tests
        run: emacs --batch -l ert -l tests.el -f ert-run-tests-batch-and-exit
